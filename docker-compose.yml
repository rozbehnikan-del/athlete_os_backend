services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_HOST: ${DATABASE_HOST:-db}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:-athlete_os}
      DATABASE_USER: ${DATABASE_USER:-athlete_os}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-athlete_os}
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-athlete_os}
      POSTGRES_USER: ${DATABASE_USER:-athlete_os}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-athlete_os}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
